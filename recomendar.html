
<!DOCTYPE HTML>
<!--ej 3-->
<HTML>
<HEAD>
    <TITLE>Recomendar sitio</TITLE>
</HEAD>

<BODY>

<H1>Recomendar sitio a un amigo</H1>

<P>Complete el siguiente formulario para recomendar este sitio a un amigo.</P>

<FORM action="recomendar.php" method="post">
    <FIELDSET>

        <P>
            <LABEL>Tu nombre:
                <INPUT type="text" name="nombre" size="25">
            </LABEL>
        </P>

        <P>
            <LABEL>Tu email:
                <INPUT type="text" name="email" size="25">
            </LABEL>
        </P>

        <P>
            <LABEL>Email de tu amigo:
                <INPUT type="text" name="email_amigo" size="25">
            </LABEL>
        </P>

        <P>
            <LABEL>Mensaje:</LABEL>
            <BR>
            <TEXTAREA name="mensaje" cols="32" rows="6">Te recomiendo visitar este sitio web.</TEXTAREA>
        </P>

        <INPUT type="submit" value="Recomendar">

    </FIELDSET>
</FORM>

</BODY>
</HTML>
